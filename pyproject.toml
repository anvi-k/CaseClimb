[project]
name = "caseclimb"
version = "0.1.0"
description = "Synthetic virtual patient encounter API"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.5",
  "mangum==0.19.0",
  "boto3==1.38.23",
  "httpx==0.28.1",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
# The rubric evaluator in evaluator/. Kept out of the API's own dependencies so the
# Lambda package does not grow; install with `uv sync --extra evaluator`.
evaluator = ["anthropic[bedrock]>=1.0", "jsonschema>=4.18"]

[dependency-groups]
dev = ["pytest==8.3.5", "jsonschema>=4.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
