[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poscere-evaluator"
version = "0.1.0"
description = "Grades a finished virtual-patient encounter against the rubric and runs the debrief."
requires-python = ">=3.10"
dependencies = ["anthropic[bedrock]>=1.0", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poscere-evaluate = "evaluator.cli:main"

[tool.setuptools]
packages = ["evaluator"]

[tool.setuptools.package-data]
evaluator = ["rubrics/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
